<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hide and Seek - Core Hub</title>
    <meta name="description" content="Un gioco multiplayer 3D di nascondino in tempo reale. Unisciti all'ambiente social hub direttamente dal browser.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Import Map per Three.js e moduli aggiuntivi -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- Container per il Canvas 3D -->
    <div id="canvas-container"></div>

    <!-- Overlay Menu Principale -->
    <div id="main-menu" class="overlay-screen">
        <div class="menu-glass-card">
            <h1 class="logo-text">HIDE & SEEK</h1>
            <p class="subtitle-text">Multiplayer 3D Social Hub</p>
            
            <div class="form-group">
                <label for="nickname-input">Scegli il tuo Nickname</label>
                <input type="text" id="nickname-input" placeholder="Nickname..." maxlength="15" autocomplete="off">
            </div>

            <div id="room-info-section" class="info-box hidden">
                <span class="info-label">Stai per entrare nella stanza di:</span>
                <span id="target-host-display" class="info-value">...</span>
            </div>

            <button id="start-btn" class="glow-button">INIZIA A GIOCARE</button>

            <div class="footer-note">
                Sviluppato con Three.js & PeerJS (P2P)
            </div>
        </div>
    </div>

    <!-- HUD di gioco (visibile dopo l'avvio) -->
    <div id="game-hud" class="hud-layer hidden">
        <div class="hud-top-left">
            <div class="hud-card">
                <div class="player-info">
                    <span class="hud-dot active"></span>
                    <span id="hud-nickname">Player</span>
                </div>
                <div class="lobby-info">
                    <span>Stanza: </span><span id="lobby-status-text">Generazione...</span>
                </div>
            </div>
            <button id="share-lobby-btn" class="hud-action-btn hidden" title="Copia link della stanza">
                <span>Condividi Stanza</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
            </button>
        </div>

        <div class="hud-top-right">
            <div class="hud-card">
                <div>Giocatori online: <span id="online-count">1</span></div>
            </div>
        </div>

        <!-- Chat di Prossimità Overlay -->
        <div id="chat-container">
            <div id="chat-messages"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder="Scrivi in chat di prossimità (Enter)..." autocomplete="off" maxlength="80">
                <button id="chat-send-btn">Invia</button>
            </div>
        </div>
    </div>

    <!-- UI Controlli Touch per Dispositivi Mobile -->
    <div id="mobile-controls" class="hidden">
        <!-- Area Joystick (Sinistra) -->
        <div id="joystick-zone">
            <div id="joystick-boundary">
                <div id="joystick-knob"></div>
            </div>
        </div>
        <!-- Area Touch Look (Destra - invisibile ma attiva per drag) -->
        <div id="touch-look-zone">
            <div class="touch-look-instruction">Trascina qui per ruotare la visuale</div>
        </div>
    </div>

    <!-- Notifiche Toast in game -->
    <div id="toast-container"></div>

    <!-- Entry Point dell'applicazione -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
